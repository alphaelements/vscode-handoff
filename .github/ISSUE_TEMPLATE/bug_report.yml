name: Bug Report
description: Report a bug in the Handoff VSCode extension
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below so we can reproduce and fix it.

  - type: input
    id: vscode-version
    attributes:
      label: VS Code Version
      description: 'Run `code --version` or check Help > About'
      placeholder: 'e.g. 1.92.0'
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      description: 'Check Extensions panel > Handoff'
      placeholder: 'e.g. 0.5.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: 'When I open the Dashboard, the Gantt chart shows...'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      value: |
        1. Open a folder with `.handoff/` directory
        2. Run command "Handoff: Open Dashboard"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output Log
      description: 'Paste any relevant output from the Handoff output channel (Cmd+Shift+U > Handoff).'
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the issue.
    validations:
      required: false
